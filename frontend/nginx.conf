# Serves the built frontend and proxies the API to the backend, so the browser
# only ever talks to one origin and no CORS configuration is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Books are uploaded whole: keep this at or above MAX_UPLOAD_SIZE_MB.
    client_max_body_size 250m;
    client_body_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Audio and archives are already compressed; gzipping them wastes CPU.
    gzip_proxied any;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Narrating a book takes minutes, and the browser waits on one request
        # for the package download. The defaults (60s) would cut both off.
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Stream the audiobook archive straight through instead of spooling a
        # multi-gigabyte response to disk first.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }

    # A single-page application: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The build output is content-hashed, so it can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
