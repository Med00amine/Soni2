[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daisy-audiobook"
version = "0.1.0"
description = "A modular DTBook to DAISY 3 audiobook pipeline."
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0,<6",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "num2words>=0.5,<0.6",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "pypdf>=5,<6",
  "sqlalchemy>=2.0,<3",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
]
production-tts = [
  "MeloTTS @ git+https://github.com/myshell-ai/MeloTTS.git",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
